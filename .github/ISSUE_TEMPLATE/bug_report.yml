name: Bug report
description: Something in DevDoctor didn't behave as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **If this is a security issue** (e.g. it could
        delete files unexpectedly or run an unintended command), please don't file
        it here — see [SECURITY.md](../blob/main/SECURITY.md) for private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I ran `diskdoctor scan` and …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks, ideally minimal.
      placeholder: |
        1. Run `diskdoctor …`
        2. …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - CLI
        - Web UI (diskdoctor serve)
        - Desktop app (Electron)
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.1 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevDoctor version / commit
      description: Output of `diskdoctor --version` or the git commit you're on.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste relevant terminal output. Redact anything sensitive.
      render: text
    validations:
      required: false
