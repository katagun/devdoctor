version: 2
updates:
  # Keep pinned GitHub Actions SHAs current (security-critical for a public repo).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: ["tech-debt"]

  # Web UI dependencies (bun.lock is committed).
  # Group only minor/patch bumps so they land in one tidy PR; major bumps come
  # as individual PRs so each breaking migration (e.g. React 19, react-router 7,
  # recharts 3, eslint 10, vite/vitest/electron majors) can be reviewed and
  # migrated deliberately instead of in a grab-bag.
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    labels: ["tech-debt"]
