<!doctype html>
<html lang="en" data-theme="terminal-refined">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevDoctor</title>
    <script>
      // Apply persisted theme before first paint so we don't FOUC from dark
      // to light (or vice versa) when the user's preference differs from the
      // hardcoded default.
      (function () {
        try {
          var raw = localStorage.getItem("diskdoctor.settings.v1");
          var t = raw ? (JSON.parse(raw).theme || "system") : "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "terminal-refined" : "terminal-refined-light",
          );
        } catch (e) {
          /* fall back to the attribute that's already on <html> */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-KAZ6lneb.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DInfnjlY.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
