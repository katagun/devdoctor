    - ~/Library/Caches/ms-playwright
  recipe: "rm -rf {path}"

- name: chrome-cache
  description: Chrome browser cache (all profiles)
  risk: safe
  platforms: [darwin]
  paths:
    - ~/Library/Caches/Google/Chrome/*/Cache
  recipe: "rm -rf {path}"

- name: firefox-cache
  description: Firefox browser cache
  risk: safe
  platforms: [darwin]
  paths:
    - ~/Library/Caches/Firefox
  recipe: "rm -rf {path}"

- name: arc-browser-cache
  description: Arc browser cache
  risk: safe
  platforms: [darwin]
  paths:
    - ~/Library/Caches/Arc
    - ~/Library/Caches/company.thebrowser.Browser
  recipe: "rm -rf {path}"

- name: docker-vm-disk
  description: Docker Desktop VM disk image (sparse on APFS; check actual usage first)
  risk: reclaimable
  platforms: [darwin]
  paths:
    - ~/Library/Containers/com.docker.docker/Data/vms
  recipe: "echo 'Docker.raw is sparse on APFS — run: du -h ~/Library/Containers/com.docker.docker/Data/vms/*.raw. If actual usage is small, shrink the Docker Desktop disk-image quota (Settings > Resources > Disk image size). If large, use Docker Desktop > Troubleshoot > Clean/Purge data. Do NOT rm -rf this path while Docker is running.'"

- name: claude-vm-bundles
  description: Claude Code VM bundles
  risk: reclaimable
  platforms: [darwin]
  paths:
    - ~/Library/Application Support/Claude/vm_bundles
  recipe: "rm -rf {path}"

- name: docker-installer
  description: Docker installer leftovers
  risk: safe
  platforms: [darwin]
  paths:
    - ~/Library/Application Support/com.docker.install
  recipe: "rm -rf {path}"

- name: slack-service-worker
  description: Slack desktop cache (login state preserved)
  risk: reclaimable
  platforms: [darwin]
  paths:
    - ~/Library/Application Support/Slack/Service Worker/CacheStorage
  recipe: "rm -rf {path}"

- name: vscode-cache
  description: VS Code / Cursor cache directories
  risk: safe
  platforms: [darwin]
  paths:
    - ~/Library/Application Support/Code/Cache
    - ~/Library/Application Support/Code/CachedData
    - ~/Library/Application Support/Cursor/Cache
    - ~/Library/Application Support/Cursor/CachedData
  recipe: "rm -rf {path}"

- name: gradle-caches
  description: Gradle user caches
  risk: safe
  platforms: [darwin, linux]
  paths:
    - ~/.gradle/caches
  recipe: "rm -rf {path}"

- name: maven-repo
  description: Maven local repository
  risk: reclaimable
  platforms: [darwin, linux]
  paths:
    - ~/.m2/repository
  recipe: "rm -rf {path}"

- name: downloads
  description: Downloads folder (review manually — may contain files you still need)
  risk: dangerous
  platforms: [darwin, linux]
  paths:
    - ~/Downloads
  recipe: "echo 'Review ~/Downloads manually before deleting anything — it usually mixes disposable installers with files you still need. List the largest items: du -sh ~/Downloads/* | sort -rh | head -20. Find files older than 90 days: find ~/Downloads -type f -mtime +90 -print. Delete what you confirm is junk: rm ~/Downloads/<filename>. Do NOT rm -rf this folder.'"

