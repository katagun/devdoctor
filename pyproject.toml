[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devdoctor"
version = "0.1.0"
description = "Repeatable disk-cache analyzer and interactive cleanup for macOS and Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "embark-delve" }]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.23"]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "starlette>=0.38",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "httpx-sse>=0.4",
  "pyinstaller>=6.20.0",
]

[project.scripts]
devdoctor = "devdoctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devdoctor"]

[tool.hatch.build.targets.wheel.force-include]
"src/devdoctor/data/paths.yaml" = "devdoctor/data/paths.yaml"
"src/devdoctor/web/_static/dist" = "devdoctor/web/_static/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/devdoctor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]  # many args is fine for constructors

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLR2004",  # magic values in asserts are idiomatic in tests
  "PLC0415",  # local imports in tests (e.g. pytest inside a function) are fine
  "RUF059",   # unpacked-but-unused is fine in tests
  "E501",     # long lines in test fixtures are fine
  "F841",     # unused locals happen in tests for readability
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/devdoctor"]
